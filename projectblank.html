<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AquaTrack — Household Water Consumption Analytics &amp; Forecasting</title>
<style>
  :root{
    --navy-950:#0b1220;
    --navy-900:#0f1b2d;
    --ink:#0f172a;
    --slate-500:#64748b;
    --slate-400:#94a3b8;
    --slate-200:#e2e8f0;
    --slate-100:#f1f5f9;
    --paper:#f6f8fb;
    --card:#ffffff;
    --aqua-600:#0e7490;
    --aqua-500:#0891b2;
    --aqua-400:#22b8cf;
    --teal-glow:#5eead4;
    --rose-500:#e11d48;
    --violet-600:#6d28d9;
    --line:#e6ebf2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:inherit;}
  .mono{font-family:'Courier New',monospace;}
  #root{min-height:100vh;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;}
  button, select, input{font-family:inherit;}

  /* ---- Landing / role select ---- */
  .landing{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(34,184,207,0.18), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(109,40,217,0.12), transparent 55%),
      var(--navy-950);
    padding:32px;
  }
  .landing-mark{display:flex;align-items:center;gap:12px;color:#f8fafc;margin-bottom:32px;}
  .landing-mark .drop{
    width:40px;height:40px;border-radius:11px;
    background:linear-gradient(155deg,var(--aqua-400),var(--aqua-600));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px -6px rgba(8,145,178,0.6);
  }
  .landing h1{color:#f8fafc;font-size:34px;margin:0 0 8px;font-weight:700;letter-spacing:-0.02em;text-align:center;}
  .landing p.sub{color:#94a3b8;text-align:center;max-width:540px;margin:0 0 40px;font-size:15px;line-height:1.6;}
  .role-grid{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:760px;}
  .role-card{
    width:320px;background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.09);
    border-radius:18px;padding:28px;cursor:pointer;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
    text-align:left;color:#e2e8f0;
  }
  .role-card:hover{transform:translateY(-4px);border-color:rgba(94,234,212,0.5);background:rgba(255,255,255,0.07);}
  .role-card .icon-wrap{
    width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;
  }
  .role-card.resident .icon-wrap{background:rgba(34,184,207,0.18);color:var(--teal-glow);}
  .role-card.admin .icon-wrap{background:rgba(109,40,217,0.22);color:#c4b5fd;}
  .role-card h3{margin:0 0 6px;font-size:17px;color:#f8fafc;}
  .role-card p{margin:0 0 16px;font-size:13px;color:#94a3b8;line-height:1.55;}
  .role-card .go{font-size:12.5px;font-weight:600;color:var(--teal-glow);}
  .role-card.admin .go{color:#c4b5fd;}
  .landing-foot{margin-top:40px;color:#475569;font-size:12px;text-align:center;letter-spacing:.02em;}

  /* ---- App shell ---- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:236px;flex-shrink:0;background:linear-gradient(185deg,var(--navy-900),var(--navy-950));
    color:#cbd5e1;display:flex;flex-direction:column;padding:20px 14px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .side-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:14px;}
  .side-brand .drop{
    width:32px;height:32px;border-radius:9px;flex-shrink:0;
    background:linear-gradient(155deg,var(--aqua-400),var(--aqua-600));
    display:flex;align-items:center;justify-content:center;
  }
  .side-brand.adm .drop{background:linear-gradient(155deg,#a78bfa,#6d28d9);}
  .side-brand .name{color:#f8fafc;font-weight:700;font-size:14.5px;line-height:1.2;}
  .side-brand .tag{color:#64748b;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;}
  .side-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#475569;padding:14px 12px 6px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
    font-size:13.5px;font-weight:500;color:#94a3b8;cursor:pointer;margin-bottom:2px;
    transition:background .15s, color .15s; user-select:none;
  }
  .nav-item svg{flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,0.05);color:#e2e8f0;}
  .nav-item.active{background:linear-gradient(90deg, rgba(8,145,178,0.35), rgba(8,145,178,0.08));color:#f8fafc;box-shadow:inset 2px 0 0 var(--teal-glow);}
  .nav-item.admin.active{background:linear-gradient(90deg, rgba(109,40,217,0.38), rgba(109,40,217,0.08));box-shadow:inset 2px 0 0 #c4b5fd;}
  .sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08);}

  .main{flex:1;min-width:0;}
  .topbar{
    height:64px;display:flex;align-items:center;justify-content:space-between;
    padding:0 28px;background:rgba(246,248,251,0.9);
    position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);
  }
  .topbar .crumb{font-size:12px;color:var(--slate-500);}
  .topbar .crumb b{color:var(--ink);}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .badge-dot{position:relative;}
  .badge-dot::after{content:'';position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--rose-500);border:2px solid var(--paper);}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(155deg,var(--aqua-400),var(--violet-600));display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;}
  .avatar.adm{background:linear-gradient(155deg,#a78bfa,#6d28d9);}
  .content{padding:26px 28px 60px;max-width:1360px;}

  .page-head{margin-bottom:20px;}
  .page-head h1{font-size:22px;margin:0 0 4px;letter-spacing:-0.01em;}
  .page-head p{margin:0;color:var(--slate-500);font-size:13.5px;}

  .grid{display:grid;gap:16px;}
  .g-4{grid-template-columns:repeat(4,1fr);}
  .g-3{grid-template-columns:repeat(3,1fr);}
  .g-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:1080px){.g-4{grid-template-columns:repeat(2,1fr);}.g-3{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:720px){.shell{flex-direction:column;}.sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;}.g-2,.g-4,.g-3{grid-template-columns:1fr;}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;}
  .card-title{font-size:13.5px;font-weight:600;color:var(--slate-500);margin:0 0 14px;text-transform:uppercase;letter-spacing:.03em;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;}
  .stat-card .k{font-size:11.5px;font-weight:600;color:var(--slate-500);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .stat-card .v{font-size:26px;font-weight:700;color:var(--ink);}
  .stat-card .v small{font-size:14px;font-weight:600;color:var(--slate-400);}
  .stat-card .foot{font-size:11.5px;color:var(--slate-500);margin-top:6px;}
  .stat-card.aqua{background:linear-gradient(160deg,#ecfeff,#ffffff);}
  .stat-card.amber{background:linear-gradient(160deg,#fffbeb,#ffffff);}
  .stat-card.violet{background:linear-gradient(160deg,#f5f3ff,#ffffff);}
  .stat-card.rose{background:linear-gradient(160deg,#fff1f2,#ffffff);}
  .stat-card.green{background:linear-gradient(160deg,#f0fdf4,#ffffff);}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;}
  .pill.up{background:#fef3c7;color:#92400e;}
  .pill.ok{background:#dcfce7;color:#166534;}
  .pill.info{background:#dbeafe;color:#1e40af;}
  .pill.inactive{background:#fee2e2;color:#991b1b;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--slate-500);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);}
  tbody td{padding:11px 12px;border-bottom:1px solid #f0f2f6;color:var(--ink);}
  tbody tr:hover{background:#fafbfd;}
  tbody tr:last-child td{border-bottom:none;}
  .tbl-wrap{overflow-x:auto;}

  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:filter .15s, transform .1s;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:linear-gradient(135deg,var(--aqua-500),var(--aqua-600));color:#fff;box-shadow:0 6px 16px -6px rgba(8,145,178,.55);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:#fff;color:var(--ink);border-color:var(--line);}
  .btn-ghost:hover{background:var(--slate-100);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}
  .icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--slate-500);}
  .icon-btn:hover{background:var(--slate-100);color:var(--ink);}

  .insight-box{display:flex;gap:12px;background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fde68a;border-radius:12px;padding:14px 16px;}
  .insight-box .ic{width:32px;height:32px;border-radius:9px;background:#fbbf24;display:flex;align-items:center;justify-content:center;color:#78350f;flex-shrink:0;}
  .insight-box b{font-size:13px;display:block;margin-bottom:2px;}
  .insight-box p{margin:0;font-size:12.5px;color:#78350f;line-height:1.5;}

  .field label{display:block;font-size:12px;font-weight:600;color:var(--slate-500);margin-bottom:6px;}
  select, input[type=text], input[type=number], input[type=email], input[type=file]{
    width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--slate-200);font-size:13px;background:#fff;color:var(--ink);
  }
  select:focus, input:focus{outline:none;border-color:var(--aqua-500);box-shadow:0 0 0 3px rgba(8,145,178,.14);}

  .progress-track{height:8px;border-radius:999px;background:var(--slate-200);overflow:hidden;}
  .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--aqua-400),#16a34a);}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:420px;box-shadow:0 30px 60px -12px rgba(0,0,0,.35);}
  .modal h3{margin:0 0 16px;font-size:16px;}
  .modal .field{margin-bottom:14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);z-index:60;display:flex;align-items:center;gap:9px;animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .empty-note{font-size:12.5px;color:var(--slate-500);text-align:center;padding:28px 10px;}
  .icon-chip{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}

  /* ---- Opening splash (plays once, before the portal mounts) ---- */
  #splash{
    position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(34,184,207,0.18), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(109,40,217,0.12), transparent 55%),
      var(--navy-950);
    transition:opacity .5s ease, visibility .5s ease;
  }
  #splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
  #splash .drop{
    width:56px;height:56px;border-radius:16px;
    background:linear-gradient(155deg,var(--aqua-400),var(--aqua-600));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 30px -6px rgba(8,145,178,0.6);
    animation:splashPulse 1.4s ease-in-out infinite;
  }
  @keyframes splashPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  #splash .name{color:#f8fafc;font-weight:700;font-size:19px;margin-top:16px;letter-spacing:-0.01em;}
  #splash .dots{display:flex;gap:5px;margin-top:14px;}
  #splash .dots span{width:6px;height:6px;border-radius:50%;background:var(--teal-glow);animation:splashDot 1.1s ease-in-out infinite;}
  #splash .dots span:nth-child(2){animation-delay:.15s;}
  #splash .dots span:nth-child(3){animation-delay:.3s;}
  @keyframes splashDot{0%,80%,100%{opacity:.25;transform:translateY(0);}40%{opacity:1;transform:translateY(-4px);}}

  /* ---- Page transition (plays on every render since innerHTML remounts nodes) ---- */
  @keyframes pageIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .content{animation:pageIn .32s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.985);}to{opacity:1;transform:translateY(0) scale(1);}}
  .card, .stat-card{animation:cardIn .4s cubic-bezier(.2,.7,.3,1) both;}
  .card{transition:box-shadow .2s ease, transform .2s ease;}
  .card:hover{box-shadow:0 10px 26px -14px rgba(15,23,42,.18);transform:translateY(-1px);}
  .grid .card:nth-child(2), .grid .stat-card:nth-child(2){animation-delay:.03s;}
  .grid .card:nth-child(3), .grid .stat-card:nth-child(3){animation-delay:.06s;}
  .grid .card:nth-child(4), .grid .stat-card:nth-child(4){animation-delay:.09s;}
  .nav-item{transition:background .18s ease, color .18s ease, transform .12s ease;}
  .nav-item:active{transform:scale(.97);}

  /* ---- Role switcher (topbar) ---- */
  .role-switch{display:flex;align-items:center;background:var(--slate-100);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;}
  .role-switch button{border:none;background:transparent;padding:6px 13px;border-radius:999px;font-size:12px;font-weight:600;color:var(--slate-500);cursor:pointer;transition:background .2s ease, color .2s ease, box-shadow .2s ease;display:flex;align-items:center;gap:6px;}
  .role-switch button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -2px rgba(15,23,42,.25);}
  .role-switch button.on.resident{color:var(--aqua-600);}
  .role-switch button.on.admin{color:var(--violet-600);}
  .role-switch button:hover:not(.on){color:var(--ink);}

  /* ---- Water meter gauge ---- */
  .meter-wrap{display:flex;align-items:center;gap:18px;}
  .meter-gauge{position:relative;flex-shrink:0;}
  .meter-gauge svg{display:block;}
  .meter-ring-bg{fill:none;stroke:var(--slate-200);}
  .meter-ring-fill{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.16,.8,.3,1);}
  .meter-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .meter-center .val{font-size:19px;font-weight:800;color:var(--ink);line-height:1;}
  .meter-center .unit{font-size:10px;color:var(--slate-500);font-weight:600;margin-top:2px;}
  .meter-drop{animation:bob 2.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  @keyframes ripple{0%{stroke-width:2;opacity:.55;}100%{stroke-width:0;opacity:0;}}

  /* ---- Sidebar mini meter widget ---- */
  .side-meter{margin:10px 2px 4px;padding:13px 12px;border-radius:14px;background:linear-gradient(160deg,rgba(34,184,207,0.14),rgba(255,255,255,0.02));border:1px solid rgba(94,234,212,0.16);}
  .side-meter-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .side-meter-top span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#5eead4;font-weight:700;}
  .side-meter-row{display:flex;align-items:center;gap:10px;}
  .side-meter-num{font-size:18px;font-weight:800;color:#f8fafc;line-height:1;}
  .side-meter-num small{font-size:10.5px;color:#64748b;font-weight:600;}
  .side-meter-bar{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden;}
  .side-meter-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--aqua-400),var(--teal-glow));width:0%;transition:width 1s cubic-bezier(.16,.8,.3,1);}
  .side-tip{margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,0.07);font-size:11px;line-height:1.5;color:#94a3b8;display:flex;gap:7px;}
  .side-tip svg{flex-shrink:0;margin-top:1px;color:#5eead4;}

  /* ---- Recommendation card ---- */
  .rec-card{display:flex;gap:12px;background:linear-gradient(135deg,#ecfeff,#f8fffe);border:1px solid #a5f3fc;border-radius:14px;padding:14px 16px;}
  .rec-card .ic{width:34px;height:34px;border-radius:10px;background:#0891b2;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rec-card b{font-size:13px;display:block;margin-bottom:3px;}
  .rec-card p{margin:0;font-size:12px;line-height:1.55;color:#155e75;}
</style>
</head>
<body>
<div id="splash">
  <div class="drop"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s7 7.58 7 12a7 7 0 1 1-14 0c0-4.42 7-12 7-12z"/></svg></div>
  <div class="name">AquaTrack</div>
  <div class="dots"><span></span><span></span><span></span></div>
</div>
<div id="root"></div>

<script>
"use strict";

/* ================= ICONS (inline SVG strings, no external deps) ================= */
var ICONS = {
  droplet: "M12 2s7 7.58 7 12a7 7 0 1 1-14 0c0-4.42 7-12 7-12z",
  home: "M3 11.5 12 4l9 7.5 M5 9.5V20h14V9.5",
  chart: "M4 19V9 M10 19V5 M16 19v-7 M4 19h16",
  trend: "M3 17l6-6 4 4 8-8 M15 6h6v6",
  bulb: "M9 18h6 M10 21h4 M12 3a6 6 0 0 0-3.5 10.9c.6.44.9 1.14.9 1.87V16h5.2v-.23c0-.73.3-1.43.9-1.87A6 6 0 0 0 12 3z",
  user: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 20c1.6-3.6 4.6-5.5 8-5.5s6.4 1.9 8 5.5",
  logout: "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5-5-5 M21 12H9",
  bell: "M8 17h8 M6 8a6 6 0 1 1 12 0c0 3 1 5 2 6H4c1-1 2-3 2-6z M10 21a2 2 0 0 0 4 0",
  users: "M9 12a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20c.8-3 3.2-5 6.5-5s5.7 2 6.5 5 M16 8.5a3 3 0 1 1 3.6 2.9 M17.5 15c2.4.4 4 2 4.5 4.4",

/* ================= WATER METER GAUGE (animated SVG donut) ================= */
// value/max drive the fill; the ring animates from 0 on every render via a deferred style update.
function meterGaugeSVG(id, value, max, size, strokeW, color){
  size = size || 128; strokeW = strokeW || 12;
  var r = (size - strokeW)/2;
  var c = 2*Math.PI*r;
  var pct = Math.max(0, Math.min(1, value/max));
  var zoneColor = color || (pct < 0.65 ? '#0891b2' : pct < 0.9 ? '#f59e0b' : '#e11d48');
  return (
    '<div class="meter-gauge" style="width:'+size+'px;height:'+size+'px;">' +
      '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">' +
        '<circle class="meter-ring-bg" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke-width="'+strokeW+'"/>' +
        '<circle id="'+id+'" class="meter-ring-fill" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke-width="'+strokeW+'" ' +
          'stroke="'+zoneColor+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+c+'" ' +
          'data-target-offset="'+(c - c*pct)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>' +
      '</svg>' +
      '<div class="meter-center"><div class="val">'+fmt1(value)+'</div><div class="unit">of '+max+' m³</div></div>' +
    '</div>'
  );
}
// Called after every render() to trigger the ring-fill transition (CSS animates the offset change).
function animateMeters(){
  document.querySelectorAll('.meter-ring-fill[data-target-offset]').forEach(function(el){
    var target = el.getAttribute('data-target-offset');
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ el.style.strokeDashoffset = target; });
    });
  });
  document.querySelectorAll('.side-meter-bar-fill[data-target-width]').forEach(function(el){
    var w = el.getAttribute('data-target-width');
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ el.style.width = w; });
    });
  });
}

/* ================= SVG CHART HELPERS (no external chart lib) ================= */
function lineChartSVG(labels, data, opts){
  opts = opts || {};
  var color = opts.color || '#0891b2';
  var W = 640, H = 220, padL = 34, padR = 14, padT = 14, padB = 26;
  var max = Math.max.apply(null, data) * 1.15 || 1;
  var min = 0;
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var stepX = labels.length > 1 ? innerW/(labels.length-1) : 0;
  function X(i){ return padL + stepX*i; }
  function Y(v){ return padT + innerH * (1 - (v-min)/(max-min || 1)); }

  var pts = data.map(function(v,i){ return X(i)+','+Y(v); });
  var linePath = 'M' + pts.join(' L');
  var areaPath = linePath + ' L' + X(data.length-1) + ',' + (padT+innerH) + ' L' + X(0) + ',' + (padT+innerH) + ' Z';

  var gridLines = '';
  var gridVals = [0, max*0.25, max*0.5, max*0.75, max];
  gridVals.forEach(function(gv){
    var y = Y(gv);
    gridLines += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#eef1f5" stroke-width="1"/>';
    gridLines += '<text x="'+(padL-8)+'" y="'+(y+3)+'" font-size="9.5" fill="#94a3b8" text-anchor="end">'+Math.round(gv)+'</text>';
  });
  var xLabels = labels.map(function(l,i){
    return '<text x="'+X(i)+'" y="'+(H-6)+'" font-size="9.5" fill="#94a3b8" text-anchor="middle">'+escapeHtml(l)+'</text>';
  }).join('');
  var dots = data.map(function(v,i){
    return '<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3.4" fill="#fff" stroke="'+color+'" stroke-width="2"/>';
  }).join('');
  var gid = 'grad'+Math.random().toString(36).slice(2,9);

  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:'+H+'px;display:block;">' +
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="'+color+'" stop-opacity="0.28"/>' +
    '<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>' +
    gridLines +
    '<path d="'+areaPath+'" fill="url(#'+gid+')" stroke="none"/>' +
    '<path d="'+linePath+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + xLabels +
  '</svg>';
}

function barChartSVG(labels, data, opts){
  opts = opts || {};
  var color = opts.color || '#0891b2';
  var W = 640, H = 220, padL = 34, padR = 14, padT = 14, padB = 26;
  var max = Math.max.apply(null, data) * 1.15 || 1;
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var n = labels.length;
  var slot = innerW / n;
  var barW = Math.min(34, slot*0.5);
  function Y(v){ return padT + innerH * (1 - v/max); }

  var gridLines = '';
  var gridVals = [0, max*0.25, max*0.5, max*0.75, max];
  gridVals.forEach(function(gv){
    var y = Y(gv);
    gridLines += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#eef1f5" stroke-width="1"/>';
    gridLines += '<text x="'+(padL-8)+'" y="'+(y+3)+'" font-size="9.5" fill="#94a3b8" text-anchor="end">'+Math.round(gv)+'</text>';
  });
  var bars = data.map(function(v,i){
    var cx = padL + slot*i + slot/2;
    var y = Y(v);
    var h = (padT+innerH) - y;
    return '<rect x="'+(cx-barW/2)+'" y="'+y+'" width="'+barW+'" height="'+h+'" rx="5" fill="'+color+'"/>';
  }).join('');
  var xLabels = labels.map(function(l,i){
    var cx = padL + slot*i + slot/2;
    return '<text x="'+cx+'" y="'+(H-6)+'" font-size="9.5" fill="#94a3b8" text-anchor="middle">'+escapeHtml(l)+'</text>';
  }).join('');

  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:'+H+'px;display:block;">' +
    gridLines + bars + xLabels +
  '</svg>';
}

function multiLineChartSVG(labels, series){
  var W = 640, H = 230, padL = 34, padR = 14, padT = 26, padB = 26;
  var allVals = [];
  series.forEach(function(s){ allVals = allVals.concat(s.data); });
  var max = Math.max.apply(null, allVals) * 1.15 || 1;
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var stepX = labels.length > 1 ? innerW/(labels.length-1) : 0;
  function X(i){ return padL + stepX*i; }
  function Y(v){ return padT + innerH * (1 - v/max); }

  var gridLines = '';
  var gridVals = [0, max*0.25, max*0.5, max*0.75, max];
  gridVals.forEach(function(gv){
    var y = Y(gv);
    gridLines += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#eef1f5" stroke-width="1"/>';
    gridLines += '<text x="'+(padL-8)+'" y="'+(y+3)+'" font-size="9.5" fill="#94a3b8" text-anchor="end">'+Math.round(gv)+'</text>';
  });
  var xLabels = labels.map(function(l,i){
    return '<text x="'+X(i)+'" y="'+(H-6)+'" font-size="9.5" fill="#94a3b8" text-anchor="middle">'+escapeHtml(l)+'</text>';
  }).join('');

  var lines = series.map(function(s){
    var pts = s.data.map(function(v,i){ return X(i)+','+Y(v); });
    var path = 'M' + pts.join(' L');
    var dots = s.data.map(function(v,i){
      return '<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3" fill="'+s.color+'"/>';
    }).join('');
    return '<path d="'+path+'" fill="none" stroke="'+s.color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' + dots;
  }).join('');

  var legend = series.map(function(s,i){
    return '<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:11px;color:#64748b;">' +
      '<span style="width:9px;height:9px;border-radius:50%;background:'+s.color+';display:inline-block;"></span>'+escapeHtml(s.label)+'</span>';
  }).join('');

  return '<div style="display:flex;justify-content:flex-end;margin-bottom:6px;">'+legend+'</div>' +
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:'+H+'px;display:block;">' + gridLines + lines + xLabels + '</svg>';
}

/* ================= RENDER HELPERS ================= */
function statCard(tone, label, value, unit, foot){
  return '<div class="stat-card '+(tone||'')+'">' +
    '<div class="k">'+escapeHtml(label)+'</div>' +
    '<div class="v">'+escapeHtml(value)+(unit?' <small>'+escapeHtml(unit)+'</small>':'')+'</div>' +
    (foot?'<div class="foot">'+escapeHtml(foot)+'</div>':'') +
  '</div>';
}

function pillFor(delta){
  if(delta > 0) return '<span class="pill up">&#9650; '+delta+' m&sup3;</span>';
  if(delta < 0) return '<span class="pill ok">&#9660; '+(-delta)+' m&sup3;</span>';
  return '<span class="pill info">No change</span>';
}

function goResidentTab(tab){ STATE.tab = tab; render(); }

function closeModals(e){
  if(e) e.stopPropagation && e.stopPropagation();
  STATE.showAddRecord = false;
  STATE.showAddUser = false;
  render();
}

function notify(msg){
  STATE.toast = msg;
  render();
  setTimeout(function(){ STATE.toast = null; render(); }, 2400);
}

function submitAddRecord(e){
  e.preventDefault();
  var id = document.getElementById('f-hh-id').value.trim();
  var name = document.getElementById('f-hh-name').value.trim();
  var month = document.getElementById('f-hh-month').value.trim() || 'June 2026';
  var cons = Number(document.getElementById('f-hh-cons').value);
  if(!id || !cons){ return false; }
  STATE.households.unshift({
    id: id, name: name || 'New Homeowner', month: month, consumption: cons,
    dateAdded: new Date().toLocaleDateString('en-US'),
    forecast: Math.round(cons*1.05), forecastMonth: 'July 2026'
  });
  STATE.showAddRecord = false;
  render();
  notify('Record added successfully');
  return false;
}

function handleCSV(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(evt){
    var text = evt.target.result;
    var lines = text.split(/\r?\n/).filter(function(l){ return l.trim().length; });
    var added = [];
    lines.forEach(function(line, idx){
      if(idx===0 && /household/i.test(line)) return;
      var parts = line.split(',').map(function(s){ return s.trim(); });
      if(parts.length>=3){
        var cons = Number(parts[2]) || 0;
        added.push({
          id: parts[0] || ('HH-'+(100+STATE.households.length+idx)),
          name: 'Imported Homeowner',
          month: parts[1] || 'June 2026',
          consumption: cons,
          dateAdded: new Date().toLocaleDateString('en-US'),
          forecast: Math.round(cons*1.05),
          forecastMonth: 'July 2026'
        });
      }
    });
    if(added.length){
      STATE.households = added.concat(STATE.households);
      render();
      notify(added.length + ' record(s) imported from CSV');
    } else {
      notify('No valid rows found in CSV');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function exportCSV(){
  var header = 'household,month,consumption,dateAdded\n';
  var rows = STATE.households.map(function(h){ return h.id+','+h.month+','+h.consumption+','+h.dateAdded; }).join('\n');
  var blob = new Blob([header+rows], {type:'text/csv'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'consumption_records.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  notify('Export started');
}

function runForecast(){
  STATE.running = true;
  render();
  setTimeout(function(){
    STATE.households = STATE.households.map(function(h){
      var noise = Math.round((Math.random()*3)-1);
      return Object.assign({}, h, {forecast: Math.max(h.consumption + 2 + noise, 5)});
    });
    STATE.running = false;
    render();
    notify('Forecast run complete for all households');
  }, 800);
}

function generateReport(title){
  var header = title + '\nGenerated ' + new Date().toLocaleString('en-US') + '\n\n';
  var body = STATE.households.map(function(h){
    return h.id + ' — ' + h.name + ': ' + h.consumption + ' m3 (forecast ' + h.forecast + ' m3)';
  }).join('\n');
  var blob = new Blob([header+body], {type:'text/plain'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = title.toLowerCase().replace(/\s+/g,'_') + '.txt'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  notify(title + ' generated');
}

function submitAddUser(e){
  e.preventDefault();
  var name = document.getElementById('f-u-name').value.trim();
  var email = document.getElementById('f-u-email').value.trim();
  var role = document.getElementById('f-u-role').value;
  if(!name || !email) return false;
  STATE.users.unshift({name:name, email:email, role:role, status:'Active'});
  STATE.showAddUser = false;
  render();
  notify('User added successfully');
  return false;
}

function toggleUserStatus(idx){
  var u = STATE.users[idx];
  u.status = u.status === 'Active' ? 'Inactive' : 'Active';
  render();
}

function saveSettings(){
  STATE.settings.threshold = Number(document.getElementById('f-threshold').value) || STATE.settings.threshold;
  STATE.settings.emailAlerts = document.getElementById('f-email-alerts').checked;
  STATE.settings.autoForecast = document.getElementById('f-auto-forecast').checked;
  notify('Settings saved');
}

/* ================= INIT ================= */
// Mount the app behind the splash, then fade the splash out once it's ready —
// this is the "transition before opening" (a boot screen), separate from the
// per-page transitions that already play every time you switch tabs.
render();
setTimeout(function(){
  var splash = document.getElementById('splash');
  if(splash){
    splash.classList.add('hide');
    setTimeout(function(){ splash.remove(); }, 550);
  }
}, 900);
</script>
</body>
</html>
